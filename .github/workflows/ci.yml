name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: re-lint when the PR body changes

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # diff-size needs the base branch
      - run: make check
      - if: github.event_name == 'pull_request'
        run: make diff-size
        env:
          BASE: origin/${{ github.base_ref }}
      - if: github.event_name == 'pull_request'
        run: scripts/check-pr-body.sh <<<"$PR_BODY"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
